<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Diagnose — Operations Maturity System</title>
  <meta name="description" content="Trace an observed operational symptom back to its likely system constraint before prescribing a fix.">

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body data-page="diagnose" data-base="../">

  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-nav"></div>

  <main id="main">

    <header class="page-header">
      <div class="container">
        <span class="eyebrow">Diagnose</span>
        <h1>Trace the symptom to the system.</h1>
        <p class="lede">
          Select what you're observing. A short line of questions will trace it
          back toward its likely system constraint &mdash; before jumping to a fix.
        </p>
      </div>
    </header>

    <section class="section">
      <div class="container">

        <div id="diagnose-intro">
          <div class="callout--stark" style="margin-bottom: var(--space-6);">
            Do not prescribe a solution before validating the cause.
          </div>
          <div id="symptom-mount" class="symptom-grid"></div>
        </div>

        <div id="diagnose-flow" hidden class="container--narrow" style="padding: 0;">
          <div class="assessment-progress">
            <div class="assessment-progress__bar">
              <div class="assessment-progress__fill" id="diagnose-progress-fill"></div>
            </div>
            <span class="assessment-progress__label" id="diagnose-progress-label"></span>
          </div>
          <div id="diagnostic-step-mount"></div>
        </div>

        <div id="diagnose-outcome" hidden class="container--narrow" style="padding: 0;">
          <div id="diagnostic-outcome-mount"></div>
        </div>

      </div>
    </section>

  </main>

  <div id="site-footer"></div>

  <script src="../js/data.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/assessment.js"></script>
  <script src="../js/blueprint-core.js"></script>
  <script src="../js/workbench-core.js"></script>
  <script src="../js/diagnostics.js"></script>
  <script src="../js/scenarios.js"></script>
  <script src="../js/dashboard.js"></script>
  <script src="../js/resource-detail.js"></script>
  <script src="../js/explore.js"></script>
  <script src="../js/learn.js"></script>
  <script src="../js/anti-patterns.js"></script>
  <script src="../js/app.js"></script>

</body>
</html>
