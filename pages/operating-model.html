<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Operating Model Designer — Operations Maturity System</title>
  <meta name="description" content="Design how an organization or team will repeatedly convert strategy into outcomes: capabilities, ownership, interfaces, workflows, and governance.">

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body data-page="build" data-base="../">

  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-nav"></div>

  <main id="main">

    <header class="page-header">
      <div class="container">
        <span class="eyebrow">Build &rsaquo; Operating Model Designer</span>
        <h1>Operating Model Designer</h1>
        <p class="lede">
          Define how an organization or team will repeatedly convert strategy into
          outcomes &mdash; not an org chart, an operating system.
        </p>
      </div>
    </header>

    <section class="section">
      <div class="container container--narrow">

        <div id="builder-launcher">
          <div class="section-head">
            <span class="eyebrow">Learn Before Building</span>
          </div>
          <div class="related-links" id="launcher-learn-links"></div>

          <div style="margin-top: var(--space-7); display:flex; gap: var(--space-3); flex-wrap: wrap;">
            <button type="button" class="btn btn--primary" id="new-project-btn">+ New Operating Model</button>
            <button type="button" class="btn btn--secondary" id="load-sample-btn">Load Sample Project</button>
          </div>

          <div id="resume-list-mount"></div>
        </div>

        <div id="builder-wizard" hidden>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-5);flex-wrap:wrap;gap:var(--space-2)">
            <button type="button" class="btn btn--ghost" id="builder-exit">&larr; Exit to My Projects</button>
            <span id="builder-project-name" class="text-mono text-dim" style="font-size:var(--step--1)"></span>
          </div>
          <div id="builder-progress" class="builder-progress"></div>
          <p id="builder-step-label" class="text-mono text-dim" style="font-size:var(--step--1);margin-bottom:var(--space-4)"></p>
          <div id="builder-step-body"></div>
          <div class="builder-step-nav">
            <button type="button" class="btn btn--secondary" id="builder-prev">&larr; Previous</button>
            <button type="button" class="btn btn--primary" id="builder-next">Next &rarr;</button>
          </div>
        </div>

      </div>
    </section>

  </main>

  <div id="site-footer"></div>

  <script src="../js/data.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/builder-core.js"></script>
  <script src="../js/blueprint-core.js"></script>
  <script src="../js/blueprint-import.js"></script>
  <script src="../js/builder-operating-model.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      OMSLinks.renderList && (document.getElementById('launcher-learn-links').innerHTML = OMSLinks.renderList([
        { label: 'Operating Model', type: 'resource', id: 'operating-models' },
        { label: 'Capability Architecture', type: 'resource', id: 'capability-mapping' },
        { label: 'Role Clarity', type: 'resource', id: 'role-clarity' },
        { label: 'Strategic Alignment', type: 'resource', id: 'strategic-alignment' }
      ]));

      OMSBuilder.launchPage({
        builderType: 'operating-model',
        label: 'Operating Model',
        engineInit: function (project) { OMSBuilderOperatingModel.init(project); },
        sampleData: OMSBuilderOperatingModel.sampleData,
        els: {
          launcher: document.getElementById('builder-launcher'),
          wizard: document.getElementById('builder-wizard'),
          newBtn: document.getElementById('new-project-btn'),
          sampleBtn: document.getElementById('load-sample-btn'),
          exitBtn: document.getElementById('builder-exit'),
          resumeList: document.getElementById('resume-list-mount'),
          projectName: document.getElementById('builder-project-name')
        }
      });
    });
  </script>

</body>
</html>
