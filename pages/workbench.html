<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Operator Workbench — Operations Maturity System</title>
  <meta name="description" content="Turn operational insight into managed action: observations become investigations, findings become priorities, priorities become interventions, results become standards.">

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body data-page="workbench" data-base="../">

  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-nav"></div>

  <main id="main">

    <header class="page-header">
      <div class="container">
        <nav id="page-breadcrumb" class="breadcrumb" aria-label="Breadcrumb"></nav>
        <span class="eyebrow">Workbench</span>
        <h1>Operator Workbench</h1>
        <p class="lede">Turn operational insight into managed action.</p>
        <p class="page-header__use-when"><strong>USE THIS WHEN</strong> you have a finding, priority, or intervention that needs to be tracked to a measured result.</p>
      </div>
    </header>

    <section class="section" style="padding-top:0">
      <div class="container">

        <div id="wb-sample-banner"></div>

        <div id="wb-stat-strip" style="margin-bottom:var(--space-5)"></div>

        <div class="bp-toolbar" style="margin-bottom:var(--space-4)">
          <input type="search" class="search-input" id="wb-search" placeholder="Search this workspace&hellip;">
          <div class="bp-tabs" id="wb-tabs"></div>
        </div>

        <div class="resource-filters" id="wb-utility-row" style="margin-bottom:var(--space-5)">
          <button type="button" class="resource-filter" id="wb-load-sample-btn">Load Sample Workspace</button>
          <button type="button" class="resource-filter" id="wb-clear-sample-btn" hidden>Clear Sample Workspace</button>
          <button type="button" class="resource-filter" id="wb-export-btn">Export Workspace</button>
          <label class="resource-filter" style="cursor:pointer">Import Workspace
            <input type="file" id="wb-import-input" accept="application/json" style="display:none">
          </label>
          <button type="button" class="resource-filter" id="wb-clear-all-btn">Clear Workspace</button>
        </div>

        <div id="wb-tab-body"></div>

      </div>
    </section>

  </main>

  <button type="button" class="btn btn--primary quick-capture-fab" id="wb-capture-fab">+ Capture</button>

  <div id="site-footer"></div>

  <script src="../js/data.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/builder-core.js"></script>
  <script src="../js/blueprint-core.js"></script>
  <script src="../js/blueprint-sample.js"></script>
  <script src="../js/valuestream-core.js"></script>
  <script src="../js/capacity-core.js"></script>
  <script src="../js/kpi-core.js"></script>
  <script src="../js/health-core.js"></script>
  <script src="../js/rhythm-core.js"></script>
  <script src="../js/governance-core.js"></script>
  <script src="../js/risk-core.js"></script>
  <script src="../js/resilience-core.js"></script>
  <script src="../js/debt-core.js"></script>
  <script src="../js/scale-core.js"></script>
  <script src="../js/transformation-core.js"></script>
  <script src="../js/workbench-core.js"></script>
  <script src="../js/workbench-sample.js"></script>
  <script src="../js/workbench.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      OMSWorkbench.init();
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.OMSNav) window.OMSNav.renderBreadcrumb('page-breadcrumb', [], "Workbench");
    });
  </script>
</body>
</html>
